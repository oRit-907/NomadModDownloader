# Builds the Microsoft Store (MSIX) package of Nomad Mod Downloader.
#
# Run it from Actions > Store package > Run workflow, or push a branch named store/<anything>.
# It makes two downloads (under the run's Artifacts):
#   - NomadModDownloader-X.Y.Z.0-x64.msix: upload this in Partner Center (the Store signs it, so it isn't signed here).
#   - NomadModDownloader-X.Y.Z.0-layout.zip: the unpacked package, to try on your own PC first:
#       turn on Developer Mode (Settings > System > For developers), unzip it, then in PowerShell in that folder:
#       Add-AppxPackage -Register .\AppxManifest.xml
#     (remove it again with: Get-AppxPackage *NomadModDownloader* | Remove-AppxPackage)
#
# The Store identity is the app's Partner Center Product identity (oRit.NomadModDownloader, published by Ignite Games).
# The repository variables STORE_IDENTITY_NAME, STORE_PUBLISHER and STORE_PUBLISHER_DISPLAY_NAME override it if set.
name: Store package

on:
  workflow_dispatch:
  push:
    branches: ['store/*']

permissions:
  contents: write

jobs:
  msix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build the app
        shell: pwsh
        run: |
          dotnet publish src/NomadModDownloader.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=false -p:EnableCompressionInSingleFile=false -o layout
          if (-not (Test-Path layout/NomadModDownloader.exe)) { throw "The publish didn't make NomadModDownloader.exe" }

      - name: Make the package
        shell: pwsh
        env:
          STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
          STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
          STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.STORE_PUBLISHER_DISPLAY_NAME }}
        run: |
          $ErrorActionPreference = 'Stop'
          [xml]$proj = Get-Content src/NomadModDownloader.csproj
          $ver = ($proj.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          if (-not $ver) { throw "No <Version> in the csproj" }
          $pkgVer = "$ver.0"
          $name = if ($env:STORE_IDENTITY_NAME) { $env:STORE_IDENTITY_NAME } else { "oRit.NomadModDownloader" }
          $pub = if ($env:STORE_PUBLISHER) { $env:STORE_PUBLISHER } else { "CN=C78A2360-73AE-4985-8DFA-921161CFDBC9" }
          $pubName = if ($env:STORE_PUBLISHER_DISPLAY_NAME) { $env:STORE_PUBLISHER_DISPLAY_NAME } else { "Ignite Games" }

          $m = Get-Content src/Package/AppxManifest.xml -Raw
          $m = $m.Replace('$STORE_IDENTITY_NAME$', [Security.SecurityElement]::Escape($name)).Replace('$STORE_PUBLISHER$', [Security.SecurityElement]::Escape($pub))
          $m = $m.Replace('$STORE_PUBLISHER_DISPLAY_NAME$', [Security.SecurityElement]::Escape($pubName)).Replace('$VERSION$', $pkgVer)
          Set-Content layout/AppxManifest.xml $m -Encoding utf8
          Copy-Item src/Package/Assets layout/Assets -Recurse

          $kit = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.*\x64" -Directory | Where-Object { Test-Path (Join-Path $_.FullName makeappx.exe) } | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $kit) { Write-Host "::error::No Windows SDK with makeappx.exe on this runner"; exit 1 }
          $makeappx = Join-Path $kit.FullName makeappx.exe
          $makepri = Join-Path $kit.FullName makepri.exe
          Write-Host "Using $($kit.FullName)"
          # Runs a tool; on failure shows its output as the error (so it can be read without opening the log).
          function Run($exe, [string[]]$a) {
            $o = & $exe @a 2>&1 | Out-String
            Write-Host $o
            if ($LASTEXITCODE) {
              $msg = ($o -split "`r?`n" | Where-Object { $_ -match 'error|fail|0x8' } | Select-Object -First 12) -join ' | '
              Write-Host "::error::$(Split-Path $exe -Leaf) $($a[0]) failed ($LASTEXITCODE): $msg"
              exit 1
            }
          }

          # resources.pri: picks the right logo size for each screen scale.
          Run $makepri @('createconfig', '/cf', 'priconfig.xml', '/dq', 'en-US', '/o')
          Run $makepri @('new', '/pr', (Resolve-Path layout).Path, '/cf', 'priconfig.xml', '/mn', (Resolve-Path layout/AppxManifest.xml).Path, '/of', (Join-Path (Resolve-Path layout).Path 'resources.pri'), '/o')

          New-Item -ItemType Directory out | Out-Null
          Run $makeappx @('pack', '/d', (Resolve-Path layout).Path, '/p', (Join-Path (Resolve-Path out).Path "NomadModDownloader-$pkgVer-x64.msix"), '/o')
          Compress-Archive -Path layout/* -DestinationPath "out/NomadModDownloader-$pkgVer-layout.zip"
          "PKGVER=$pkgVer" | Out-File $env:GITHUB_ENV -Append

      - uses: actions/upload-artifact@v4
        with:
          name: NomadModDownloader-${{ env.PKGVER }}-store
          path: out/*

      # For a store/ branch: put the package on the branch store-out/<name> (in parts under 100 MB, joined with
      # cat or copy /b), so it can be fetched with git alone, and remove the store/ branch.
      - name: Hand back the package
        if: startsWith(github.ref, 'refs/heads/store/')
        shell: bash
        run: |
          set -euo pipefail
          OUT="store-out/${GITHUB_REF_NAME#store/}"
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan "$OUT"
          git rm -rf -q --cached . > /dev/null
          mkdir -p handback
          for f in out/*.msix; do
            n="$(basename "$f")"
            split -b 90m -d -a 2 "$f" "handback/$n.part"
            (cd out && sha256sum "$n") >> handback/SHA256SUMS
          done
          git add -f handback
          git commit -q -m "Store package ${PKGVER}"
          git push -f origin "HEAD:refs/heads/$OUT"
          git push origin --delete "$GITHUB_REF_NAME"
